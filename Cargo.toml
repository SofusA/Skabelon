[package]
name = "skabelon"
version = "0.2.0"
edition = "2024"
description = "Simple templating engine for rust using angular syntax"
license = "MIT"
repository = "https://github.com/sofusa/skabelon"

[dependencies]
serde = "1"
serde_json = "1"
glob = "0.3"
pathdiff = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "render_bench"
harness = false

[[bench]]
name = "variable_bench"
harness = false
